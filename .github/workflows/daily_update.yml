name: Daily Macro Risk Update

on:
  schedule:
    # 每天 UTC 时间 0:00 (北京时间早 8:00) 自动运行
    - cron: '0 0 * * *'
  workflow_dispatch: # 支持在 GitHub 界面手动触发

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Analytics Pipeline
      run: |
        python src/analytics.py

    - name: Commit and push updated data
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add data/latest_scores.json
        git commit -m "Auto-update: macro risk indicators [skip ci]" || exit 0
        git push
